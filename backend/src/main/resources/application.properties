# Nome da aplicação
spring.application.name=marmita-manager

# Conexão com o banco (precisa bater com o que definimos no docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/marmita_manager
spring.datasource.username=marmita_user
spring.datasource.password=marmita_pass
spring.datasource.driver-class-name=org.postgresql.Driver

#só confere, na inicialização, se o schema do banco bate com o que suas @Entity esperam — e recusa subir a aplicação se houver divergência.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do Postgres (ajuda o Hibernate a gerar SQL otimizado pra esse banco específico)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

aws.s3.bucket-name=marmita-manager-isabelavill-comprovantes

aws.sqs.queue-url=https://sqs.us-east-2.amazonaws.com/437945109300/marmita-comprovantes-queue